name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-packages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Set package scope and repository from GitHub
        run: bun run configure
      - run: bun run check
      - run: bun pm pack --dry-run
      - name: Publish to GitHub Packages
        run: |
          echo '//npm.pkg.github.com/:_authToken=${NPM_CONFIG_TOKEN}' >> .npmrc
          bun publish --registry=https://npm.pkg.github.com
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
